<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f2e9" />
  <meta name="description" content="An interactive 3D pelican on a bicycle." />
  <title>Pelican Ride — gpt-blender</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5" cy="16" r="4"/><circle cx="19" cy="16" r="4"/><path d="m5 16 5-9 5 9H5m5-9h7l2 9M8 7h4m4-3h2l1 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3v-4a5 5 0 0 0-10 0v4l-2 3Zm5 3h4M12 3V1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/><path d="M7 4c3-2 7 1 10 6s3 9 0 10-7-1-10-6S4 5 7 4Z"/><circle cx="12" cy="12" r="1"/></symbol>
  </defs></svg>
  <header class="site-header">
    <a href="../" class="brand" aria-label="gpt-blender home"><span class="brand-icon"><svg><use href="#i-bike"/></svg></span><span>gpt-blender</span></a>
    <h1>Pelican Ride</h1>
    <a href="../" class="gallery-link">Gallery ↗</a>
  </header>
  <main>
    <section class="exhibit" aria-label="Interactive 3D pelican riding a bicycle">
      <div class="scene-wrap" id="sceneWrap">
        <canvas id="scene" tabindex="0" aria-label="Drag to rotate. Scroll or pinch to zoom."></canvas>
        <div class="loading" id="loading" role="status"><span class="loading-bike"><svg><use href="#i-bike"/></svg></span><p id="loadingText">Loading…</p><div class="load-track"><i id="loadProgress"></i></div><button id="retry" hidden>Retry</button></div>
      </div>
      <div class="view-control" role="group" aria-label="Camera views"><button data-view="ride" class="selected" aria-pressed="true" disabled>Ride</button><button data-view="side" aria-pressed="false" disabled>Side</button><button data-view="face" aria-pressed="false" disabled>Close-up</button></div>
    </section>
    <section class="ride-controls" aria-label="Ride controls">
      <button id="pause" class="play-button" aria-label="Pause ride" title="Pause ride (Space)" disabled><svg><use href="#i-pause"/></svg></button>
      <div class="speed-control"><label for="speed">Speed <output for="speed" id="speedValue">1.0×</output></label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Ride speed" disabled/></div>
      <div class="action-controls"><button id="bell" class="icon-button" aria-label="Ring bell" title="Ring bell (B)" disabled><svg><use href="#i-bell"/></svg></button><button id="orbit" class="icon-button" aria-label="Auto orbit" aria-pressed="false" title="Auto orbit" disabled><svg><use href="#i-orbit"/></svg></button><button id="capture" class="icon-button" aria-label="Save photo" title="Save photo" disabled><svg><use href="#i-camera"/></svg></button><button id="reset" class="icon-button" aria-label="Reset ride" title="Reset ride" disabled><svg><use href="#i-reset"/></svg></button></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="no-script">Enable JavaScript to view the scene.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
