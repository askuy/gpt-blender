<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鹈鹕骑自行车 · SVG 2D 动画</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --ink: #13303a;
        --muted: #58727a;
        --line: rgba(19, 48, 58, 0.15);
        --paper: #f7fbfa;
        --accent: #ee6d4d;
        --accent-dark: #c94d37;
        --speed: 1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.92), transparent 32rem),
          linear-gradient(135deg, #e7f4f1 0%, #f9f6ee 100%);
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 42px;
      }

      .masthead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 52px);
        line-height: 0.98;
        letter-spacing: -0.02em;
      }

      .intro {
        max-width: 360px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        text-align: right;
      }

      .stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #d9f1ee;
        box-shadow: 0 24px 54px rgba(28, 72, 78, 0.14);
      }

      .stage::after {
        position: absolute;
        right: 22px;
        bottom: 14px;
        left: 22px;
        height: 1px;
        background: rgba(255, 255, 255, 0.5);
        content: "";
        pointer-events: none;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .ui-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 2px 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #38a884;
        box-shadow: 0 0 0 4px rgba(56, 168, 132, 0.15);
      }

      .status-dot.paused {
        background: #d18b46;
        box-shadow: 0 0 0 4px rgba(209, 139, 70, 0.15);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button,
      .speed-control {
        border: 1px solid rgba(19, 48, 58, 0.16);
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        font: inherit;
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 13px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      button:hover {
        border-color: rgba(19, 48, 58, 0.35);
        background: #fff;
        transform: translateY(-1px);
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(238, 109, 77, 0.34);
        outline-offset: 2px;
      }

      .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .primary:hover {
        border-color: var(--accent-dark);
        background: var(--accent-dark);
      }

      .button-icon {
        display: inline-grid;
        width: 14px;
        height: 14px;
        place-items: center;
        font-size: 11px;
        line-height: 1;
      }

      .speed-control {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 38px;
        padding: 0 11px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      input[type="range"] {
        width: 104px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .credit {
        margin: 14px 2px 0;
        color: #6f868b;
        font-size: 12px;
      }

      /* The scene uses CSS animation so the controls can pause everything at once. */
      .animated {
        transform-box: fill-box;
        transform-origin: center;
        animation-play-state: running;
      }

      .wheel-spin {
        animation: spin 1.55s linear infinite;
      }

      .pedal-spin {
        animation: spin 1.1s linear infinite reverse;
      }

      .pelican-bob {
        animation: bob 1.1s ease-in-out infinite;
      }

      .wing-flap {
        transform-box: fill-box;
        transform-origin: 446px 222px;
        animation: flap 1.1s ease-in-out infinite;
      }

      .leg-front {
        transform-box: view-box;
        transform-origin: 426px 287px;
        animation: legFront 1.1s ease-in-out infinite;
      }

      .leg-back {
        transform-box: view-box;
        transform-origin: 474px 287px;
        animation: legBack 1.1s ease-in-out infinite;
      }

      .cloud-a {
        animation: cloud 28s linear infinite;
      }

      .cloud-b {
        animation: cloud 38s linear -13s infinite;
      }

      .road-mark {
        animation: road 1.7s linear infinite;
      }

      .feather-tuft {
        animation: tuft 1.1s ease-in-out infinite;
      }

      .is-paused .animated,
      .is-paused .animated *,
      .is-paused .cloud-a,
      .is-paused .cloud-b,
      .is-paused .road-mark,
      .is-paused .feather-tuft {
        animation-play-state: paused !important;
      }

      .is-restarting .animated,
      .is-restarting .cloud-a,
      .is-restarting .cloud-b,
      .is-restarting .road-mark,
      .is-restarting .feather-tuft {
        animation: none !important;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes flap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-9deg);
        }
      }

      @keyframes legFront {
        0%,
        100% {
          transform: rotate(17deg);
        }
        50% {
          transform: rotate(-25deg);
        }
      }

      @keyframes legBack {
        0%,
        100% {
          transform: rotate(-25deg);
        }
        50% {
          transform: rotate(17deg);
        }
      }

      @keyframes cloud {
        from {
          transform: translateX(-180px);
        }
        to {
          transform: translateX(1120px);
        }
      }

      @keyframes road {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-210px);
        }
      }

      @keyframes tuft {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-2px) rotate(2deg);
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding-top: 22px;
        }

        .masthead {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .intro {
          max-width: 520px;
          text-align: left;
        }

        .ui-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .controls {
          width: 100%;
          flex-wrap: wrap;
        }

        .speed-control {
          flex: 1 1 160px;
          justify-content: space-between;
        }

        input[type="range"] {
          width: min(42vw, 160px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wheel-spin,
        .pedal-spin,
        .pelican-bob,
        .wing-flap,
        .leg-front,
        .leg-back,
        .cloud-a,
        .cloud-b,
        .road-mark,
        .feather-tuft {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div>
          <p class="eyebrow">Inline SVG / 2D animation</p>
          <h1>鹈鹕骑自行车</h1>

        <p class="intro">一只腿很长、心情很好的鹈鹕，沿着海边慢慢骑过午后的风。</p>
      </header>

      <section class="stage" aria-label="鹈鹕骑自行车动画">

                  <line x1="-52" y1="52" x2="52" y2="-52" />
                  <line x1="-19" y1="-70" x2="19" y2="70" />

                <circle r="73" fill="none" stroke="#8eb6b0" stroke-width="3" />

                  <line x1="0" y1="-73" x2="0" y2="73" />
                  <line x1="-52" y1="-52" x2="52" y2="52" />
                  <line x1="-52" y1="52" x2="52" y2="-52" />

      </section>

      <div class="ui-bar">
        <div class="status" aria-live="polite">
          <span id="statusDot" class="status-dot" aria-hidden="true"></span>
          <span id="statusText">正在骑行 · 速度 1.0x</span>
        </div>
        <div class="controls">
          <button id="toggleButton" class="primary" type="button" aria-pressed="false">
            <span id="toggleIcon" class="button-icon" aria-hidden="true">Ⅱ</span>
            <span id="toggleLabel">暂停</span>
          </button>
          <button id="replayButton" type="button">
            <span class="button-icon" aria-hidden="true">↻</span>
            <span>重播</span>
          </button>
          <label class="speed-control" for="speed">
            <span>速度</span>
            <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" />
            <output id="speedValue" for="speed">1.0x</output>
          </label>
        </div>
      </div>
      <p class="credit">单文件 HTML · SVG 绘制 · 无外部依赖</p>
    </main>

    <script>
      (() => {
        const scene = document.querySelector("#scene");
        const toggleButton = document.querySelector("#toggleButton");
        const toggleIcon = document.querySelector("#toggleIcon");
        const toggleLabel = document.querySelector("#toggleLabel");
        const replayButton = document.querySelector("#replayButton");
        const speed = document.querySelector("#speed");
        const speedValue = document.querySelector("#speedValue");
        const statusText = document.querySelector("#statusText");
        const statusDot = document.querySelector("#statusDot");
        const animatedNodes = [...scene.querySelectorAll("[class*='animated'], .cloud-a, .cloud-b, .road-mark, .feather-tuft")];
        let paused = false;

        const setSpeed = () => {
          const factor = Number(speed.value);
          speedValue.textContent = `${factor.toFixed(1)}x`;
          statusText.textContent = `${paused ? "已暂停" : "正在骑行"} · 速度 ${factor.toFixed(1)}x`;
          animatedNodes.forEach((node) => {
            const baseDuration = Number(node.dataset.duration || 1);
            if (!node.dataset.duration) {
              const style = getComputedStyle(node);
              const seconds = parseFloat(style.animationDuration);
              node.dataset.duration = Number.isFinite(seconds) ? seconds : 1;
            }
            node.style.animationDuration = `${Number(node.dataset.duration) / factor}s`;
          });
        };

        const setPaused = (nextPaused) => {
          paused = nextPaused;
          scene.classList.toggle("is-paused", paused);
          statusDot.classList.toggle("paused", paused);
          toggleButton.setAttribute("aria-pressed", String(paused));
          toggleIcon.textContent = paused ? "▶" : "Ⅱ";
          toggleLabel.textContent = paused ? "继续" : "暂停";
          setSpeed();
        };

        toggleButton.addEventListener("click", () => setPaused(!paused));

        replayButton.addEventListener("click", () => {
          paused = false;
          scene.classList.remove("is-paused");
          scene.classList.add("is-restarting");
          setPaused(false);
          requestAnimationFrame(() => {
            scene.classList.remove("is-restarting");
            setSpeed();
          });
        });

        speed.addEventListener("input", setSpeed);
        setSpeed();
      })();
    </script>
  </body>
</html>
